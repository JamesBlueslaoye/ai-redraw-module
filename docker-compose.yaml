services:
  ai-redraw:
    image: ghcr.io/jamesblueslaoye/ai-redraw-module:main
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3481
      AI_REDRAW_PROVIDER: nanobanana_ai
      NANO_BANANA_API_KEY: your_key
      DEMO_USER_ID: demo-user
    ports:
      - "3481:3481"
    volumes:
      - /Volumes/docker/AIredrawtool/data:/app/data
