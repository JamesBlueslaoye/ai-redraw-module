services:
  ai-redraw:
    image: ghcr.io/jamesblueslaoye/ai-redraw-module:main
    container_name: ai-redraw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3481
      AI_REDRAW_PROVIDER: ${AI_REDRAW_PROVIDER:-nanobanana_ai}
      NANO_BANANA_API_KEY: ${NANO_BANANA_API_KEY:-}
      DEMO_USER_ID: ${DEMO_USER_ID:-demo-user}
    ports:
      - "${PORT:-3481}:3481"
    volumes:
      - ./data:/app/data
